name: CI Linux samples/cores

on:
  push:
    branches:
      - master
    paths:
      - 'cores/libretro-ffmpeg/**'
      - 'libretro-common/queues/**'
      - 'libretro-common/include/retro_spsc.h'
      - 'libretro-common/include/retro_atomic.h'
      - 'samples/cores/**'
      - 'gfx/video_raster.c'
      - 'gfx/video_raster.h'
      - '.github/workflows/Linux-samples-cores.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'cores/libretro-ffmpeg/**'
      - 'libretro-common/queues/**'
      - 'libretro-common/include/retro_spsc.h'
      - 'libretro-common/include/retro_atomic.h'
      - 'samples/cores/**'
      - 'gfx/video_raster.c'
      - 'gfx/video_raster.h'
      - '.github/workflows/Linux-samples-cores.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  samples-cores:
    name: Build and run samples/cores
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Install dependencies
        timeout-minutes: 5
        run: |
          pkgs="build-essential pkg-config ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev"
          if dpkg -s $pkgs >/dev/null 2>&1; then
            echo "All packages already present on runner image; skipping apt."
            exit 0
          fi
          for i in 1 2 3; do
            sudo timeout 90 apt-get update -y \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && break
            echo "apt-get update failed (attempt $i); retrying in 10s"
            sleep 10
          done
          sudo apt-get install -y \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            $pkgs

      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.workflow }}-${{ github.job }}-

      - name: Enable ccache
        run: |
          set -eu
          command -v ccache >/dev/null 2>&1 || sudo apt-get install -y -qq ccache
          export CCACHE_DIR="$HOME/.ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache -M 500M
          ccache -z

      - name: Build and run camera ffmpeg_live_test (plain, ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/camera/ffmpeg_live
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq libavdevice-dev libavfilter-dev
          # The camera driver against lavfi: built with its input
          # format set to libavfilter, a filter graph is the device and
          # the whole pipeline runs with no camera attached - avformat
          # opens the source, the poll thread reads, the decoder
          # decodes, swscale converts and poll() takes the frame out
          # under the buffer's lock.
          #
          # The cases are the ones the threading has to get right and
          # that no eyeball on a webcam would show: start and stop
          # repeatedly, stop while the thread is mid-frame, free
          # without stopping, poll before starting, and a source that
          # does not exist.
          make clean all
          ./ffmpeg_live_test
          echo "[pass] ffmpeg_live_test"
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
             timeout 600 ./ffmpeg_live_test
          echo "[pass] ffmpeg_live_test (ASan)"
          make clean all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1:suppressions=../../cores/ffmpeg_audio_pipe/tsan.supp \
             timeout 600 ./ffmpeg_live_test
          echo "[pass] ffmpeg_live_test (TSan)"

      - name: Build and run ffmpeg_sweep_test (plain, ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/cores/ffmpeg_sweep
        run: |
          set -eu
          # Breadth where ffmpeg_audio_pipe_test has depth: eight clips
          # across containers, video and audio codecs, rates, channel
          # counts and the one-sided cases, each loaded, run, seeked
          # both ways, reset and unloaded in one process - so the
          # second load is what finds what the first unload left
          # behind - then files that are truncated, stubbed, noise,
          # empty or absent, then teardown while the decode thread is
          # still working.
          #
          # Leak detection off: libavutil's HW-device probing keeps a
          # few objects, as the audio-pipe lane already has it. The
          # libav* TSan suppressions are the same ones and for the
          # same reason.
          make clean all
          ./ffmpeg_sweep_test
          echo "[pass] ffmpeg_sweep_test"
          make clean all SANITIZER=address,undefined
          ASAN_OPTIONS=detect_leaks=0:detect_stack_use_after_return=1 \
             UBSAN_OPTIONS=print_stacktrace=1 timeout 900 ./ffmpeg_sweep_test
          echo "[pass] ffmpeg_sweep_test (ASan)"
          make clean all SANITIZER=thread
          TSAN_OPTIONS=halt_on_error=1:suppressions=../ffmpeg_audio_pipe/tsan.supp \
             timeout 900 ./ffmpeg_sweep_test
          echo "[pass] ffmpeg_sweep_test (TSan)"

      - name: Build and run ffmpeg_audio_pipe_test (ASan + UBSan, TSan)
        shell: bash
        working-directory: samples/cores/ffmpeg_audio_pipe
        run: |
          set -eu
          # cores/libretro-ffmpeg/ffmpeg_core.c as a libretro host would
          # drive it: a generated clip (tone under a test pattern), 5 s
          # of frames checked for the audio frame count and a tone in
          # every batch, then R1/L1 seeks both ways - the decode-thread
          # / main-thread handshake around the audio ring - and a
          # teardown mid-stream, all on a watchdog.  Needs the ffmpeg
          # CLI to generate the clip.  Leak detection off: libavutil's
          # own HW-device probing allocates and keeps a few objects.
          make clean all SANITIZER=address,undefined
          test -x ffmpeg_audio_pipe_test
          ASAN_OPTIONS=detect_leaks=0:detect_stack_use_after_return=1 \
             UBSAN_OPTIONS=print_stacktrace=1 timeout 300 \
             ./ffmpeg_audio_pipe_test
          echo "[pass] ffmpeg_audio_pipe_test (ASan)"
          make clean all SANITIZER=thread
          # The libav* libraries are uninstrumented, so TSan cannot see
          # the atomics that order an AVBufferRef's reference count and
          # reports the allocation and the release as a race. Only
          # those libraries are suppressed; a race in the core's own
          # code is still reported.
          TSAN_OPTIONS=halt_on_error=1:suppressions=tsan.supp \
             timeout 300 ./ffmpeg_audio_pipe_test
          echo "[pass] ffmpeg_audio_pipe_test (TSan)"

      - name: Build and run raster_poll_test and raster_poll_conform (plain, ASan + UBSan)
        shell: bash
        working-directory: samples/cores/raster_poll
        run: |
          set -eu
          # The raster poll contract checker against synthetic call
          # sequences, then the test core driven through it at 1, 8
          # and 240 rows per call, and its state round trip. Then the
          # conformance runner loading the test core: clean at each
          # rows-per-call value, the same frames with and without the
          # interface, and a row changed after it was reported caught.
          conform() {
             for rows in 1 8 240; do
                timeout 60 ./raster_poll_conform --frames 120 --expect-polls \
                   --set raster_poll_rows_per_call=$rows \
                   ./raster_poll_libretro.so
             done
             timeout 60 ./raster_poll_conform --frames 120 \
                --hash-out "$RUNNER_TEMP/poll.hash" ./raster_poll_libretro.so
             timeout 60 ./raster_poll_conform --frames 120 --no-interface \
                --hash-out "$RUNNER_TEMP/plain.hash" ./raster_poll_libretro.so
             cmp "$RUNNER_TEMP/poll.hash" "$RUNNER_TEMP/plain.hash"
             if out=$(timeout 60 ./raster_poll_conform --frames 10 \
                   --set raster_poll_mutate=enabled ./raster_poll_libretro.so); then
                echo "$out"
                echo "raster_poll_conform missed a row changed after it was reported"
                exit 1
             fi
             echo "$out" | grep -q ', 10 mismatched rows,'
          }
          make clean all
          ./raster_poll_test
          conform
          echo "[pass] raster_poll_test, raster_poll_conform"
          make clean all SANITIZER=address,undefined
          export ASAN_OPTIONS=detect_stack_use_after_return=1
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          timeout 120 ./raster_poll_test
          conform
          echo "[pass] raster_poll_test, raster_poll_conform (ASan + UBSan)"
