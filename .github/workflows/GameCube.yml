name: CI GameCube

on:
  push:
    branches: [master]
  pull_request:
  repository_dispatch:
    types: [run_build]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: devkitpro/devkitppc:latest
      options: --user root

    steps:
    - uses: taiki-e/checkout-action@v1

    - name: Set up ccache
      run: |
        command -v ccache > /dev/null || {
          s=$(command -v sudo || true)
          $s apt-get update -qq
          $s apt-get install -y -qq --no-install-recommends ccache > /dev/null
        }
        echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: .ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ github.workflow }}-${{ github.job }}-

    - name: Compile RA
      run: |
        make -f Makefile.ngc -j$(getconf _NPROCESSORS_ONLN) clean
        bash .github/workflows/scripts/ccache-make.sh -f Makefile.ngc -j$(getconf _NPROCESSORS_ONLN) HAVE_STATIC_DUMMY=1 info all

    - name: ccache statistics
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: ccache -sv

    - name: Save ccache
      # Only master's pushes keep a cache: pull requests restore
      # master's, so one push does not evict the next one's.
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: actions/cache/save@v4
      with:
        path: .ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}

