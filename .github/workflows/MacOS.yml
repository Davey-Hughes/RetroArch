name: CI macOS

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Compile RA
      run: |
        set -o pipefail
        xcodebuild -workspace pkg/apple/RetroArch.xcworkspace -scheme RetroArch -config Release -xcconfig pkg/apple/GitHubCI.xcconfig -derivedDataPath build

    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - uses: actions/upload-artifact@v6
      with:
        name: RetroArch-${{ steps.slug.outputs.sha8 }}
        path: |
          build/Build/Products/Release

  # The Xcode workspace above never defines HAVE_QT, so the Cocoa + Qt
  # combination is only reachable through configure. Build it here so a
  # break in code behind #ifdef HAVE_QT does not ship unnoticed.
  configure-qt:
    name: configure + Qt build
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies
      run: brew install qt pkg-config

    - name: Configure
      run: ./configure --enable-qt

    - name: Compile RA
      run: make -j$(sysctl -n hw.ncpu)
